[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "desktop-companion-agent"
version = "0.1.0"
description = "A personal desktop AI companion agent."
requires-python = ">=3.11,<3.12"

dependencies = [
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "requests",
    "websockets",
    "sqlalchemy",
    "openai>=3.10.0,<4",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = [
    "src/agent_core/tests",
]


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]


[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_return_any = true
